name: Delete merged branches

# 자동 머지는 GitHub Actions 봇이 수행하기 때문에 저장소의 "머지 후 브랜치 자동 삭제" 설정과
# pull_request closed 이벤트가 동작하지 않는다. 대신 15분마다 머지된 PR의 브랜치를 찾아 지운다.
# 열린 PR이 있거나 머지 후 새 커밋이 push된 브랜치는 건드리지 않는다.

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          open_heads=$(gh pr list -R "$REPO" --state open --limit 200 --json headRefName --jq '.[].headRefName')
          gh pr list -R "$REPO" --state merged --limit 50 \
            --json headRefName,headRefOid,isCrossRepository \
            --jq '.[] | select(.isCrossRepository | not) | "\(.headRefName) \(.headRefOid)"' |
          while read -r branch sha; do
            [ "$branch" = "main" ] && continue
            grep -qxF "$branch" <<< "$open_heads" && continue
            current=$(gh api "repos/$REPO/git/ref/heads/$branch" --jq .object.sha 2>/dev/null) || continue
            [ "$current" = "$sha" ] || continue
            gh api -X DELETE "repos/$REPO/git/refs/heads/$branch" && echo "deleted $branch"
          done
